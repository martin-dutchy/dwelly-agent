# Voice gateway (src/voice/server.ts). Deploy steps: src/voice/DEPLOY.md.
app = "dwelly-voice"
primary_region = "lhr"

[env]
  PORT = "8080"
  VOICE_BRAIN = "native"

[http_service]
  internal_port = 8080
  force_https = true
  # Per-call state (verification, ledger, pi sessions) lives in memory: keep exactly one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
