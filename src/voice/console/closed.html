<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Link Not Active</title>
<style>
  :root { --bg:#f6f5f2; --ink:#1c1b19; --muted:#6b6860; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151514; --ink:#ecebe7; --muted:#a29f96; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  p { color: var(--muted); }
</style>
</head>
<body><main><h1>This link isn't active</h1><p>Ask the person who sent it for a new one.</p></main></body>
</html>
